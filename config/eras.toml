# Era boundaries git cannot see.
#
# Read `analytics/eras.py` first. Everything derivable from commit history is
# ALREADY derived there — do not restate a config edit, a strategy change or a
# signal-path change here, because the commit is a better record than this file
# will ever be. What belongs here is the class git is blind to: a DB mutation, a
# re-run that rewrote stored rows, or a data gap that made a window
# unrepresentative of the book that was nominally running.
#
# Every entry needs `id`, `date` (YYYY-MM-DD, UTC), `scope`, `label` and `why`;
# the loader RAISES on a missing field rather than skipping the entry, because a
# silently-dropped boundary reports a sample as cleaner than it is.
#
# `scope` names the population the event invalidates:
#   backtest — rows in `backtest_trades` / `backtest_runs`
#   ledger   — rows in the live outcome ledger (`signal_alert_outcomes`)
#   ratings  — `confidence_ratings`, i.e. what the live gate reads
#
# Keep this list SHORT and verifiable. An entry nobody can check is worse than an
# absent one: it makes the registry look complete while carrying a guess.

[[boundary]]
id = "orphan-prune-615"
date = "2026-08-13"
scope = "ratings"
label = "orphan prune (#615) deleted 206 undeclared confidence_ratings rows"
why = """
`prune_undeclared_ratings` removed every rated cell no live config declares:
table 493 -> 287, stored ★>=4 55 -> 47 (stored now equals declared). The prune
DELETED ONLY — no kept row changed stars — but a decay review whose window spans
this date is measuring THE PRUNE, not decay, because the rated population itself
changed size mid-sample.
"""

