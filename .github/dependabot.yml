version: 2
updates:
  # Poetry project: Dependabot uses "pip" ecosystem to track pyproject.toml / poetry.lock
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    # Let a bad release get yanked before it reaches a PR here. Applies to the
    # whole ecosystem; security updates ignore the cooldown by design.
    cooldown:
      default-days: 7
    allow:
      - dependency-type: "direct"
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: "development"
      runtime-dependencies:
        dependency-type: "production"

  # web/ui is a SEPARATE npm project and was outside every ecosystem here until
  # 2026-09-02. The cost was measured: HIGH advisory #41 (nanoid < 3.3.18, a
  # transitive dev dep of postcss) sat OPEN for 19 days with no PR, while
  # `automated-security-fixes` was enabled the whole time -- an alert Dependabot
  # can see is not an alert it can act on, and only a manifest entry closes that.
  - package-ecosystem: "npm"
    directory: "/web/ui"
    schedule:
      interval: "weekly"
    # Let a bad release get yanked before it reaches a PR here. Applies to the
    # whole ecosystem; security updates ignore the cooldown by design.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    # SCOPED TO npm ON PURPOSE -- pip and github-actions have been running for
    # months and absorb majors fine. This directory had NEVER had version
    # updates, so enabling it in #730 surfaced every deferred major at once:
    # both first-run PRs went red on frontend-check. #732 was a real
    # lightweight-charts v4->v5 migration (11 svelte-check errors; `addLineSeries`
    # and `setMarkers` are gone), and #731 was not work at all -- the group put
    # typescript ^7.0.2 beside svelte-check@4.7.6, whose peer range is
    # ^5.0.0 || ^6.0.0, so `npm ci` died ERESOLVE before any build.
    #
    # This does NOT give back the security coverage the ecosystem was added for:
    # security fixes are almost always patch-level (nanoid 3.3.16 -> 3.3.18 is
    # exactly that shape), so minor/patch keeps flowing and only migrations stop
    # arriving unannounced. A major here is a task to schedule, not a PR to merge.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      dev-dependencies:
        dependency-type: "development"
      runtime-dependencies:
        dependency-type: "production"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Let a bad release get yanked before it reaches a PR here. Applies to the
    # whole ecosystem; security updates ignore the cooldown by design.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
