version: 2
updates:
  # Poetry project: Dependabot uses "pip" ecosystem to track pyproject.toml / poetry.lock
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    # Let a bad release get yanked before it reaches a PR here. Applies to the
    # whole ecosystem; security updates ignore the cooldown by design.
    cooldown:
      default-days: 7
    allow:
      - dependency-type: "direct"
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: "development"
      runtime-dependencies:
        dependency-type: "production"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Let a bad release get yanked before it reaches a PR here. Applies to the
    # whole ecosystem; security updates ignore the cooldown by design.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
