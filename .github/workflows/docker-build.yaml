name: Docker Build

# The path filter lives at the TRIGGER level, not inside a step. A step-level
# filter still spins up a runner (checkout + the filter action) for every
# docs-only PR and only then decides to skip -- confirmed on PR #539, a 7-line
# markdown change that paid for a runner. At the trigger level the workflow does
# not start at all.
#
# Safe here because `main` carries no required status checks, so a check that
# never reports cannot leave a PR stuck "expected". Re-check this if branch
# protection is ever enabled.
on:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker-compose.yml'
      - 'pyproject.toml'
      - 'poetry.lock'
      - '.github/workflows/docker-build.yaml'
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker-compose.yml'
      - 'pyproject.toml'
      - 'poetry.lock'
      - '.github/workflows/docker-build.yaml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true   # newest push wins, main included (see lint.yaml)

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        run: docker build -t buibui-bot .
