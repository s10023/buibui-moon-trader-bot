name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  pull-requests: read

# Supersede in-flight PR runs; never cancel on main — a cancelled main run
# destroys the record of whether main is green.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Check for Markdown changes
        id: changes
        uses: dorny/paths-filter@v4
        with:
          filters: |
            markdown:
              - '**/*.md'
              - '.markdownlint.json'
              - '.markdownlint-cli2.jsonc'
            skills:
              - '.claude/skills/**'
              - '.github/scripts/update-skills.sh'

      - name: markdownlint-cli2
        if: steps.changes.outputs.markdown == 'true'
        uses: DavidAnson/markdownlint-cli2-action@v24.2.0
        with:
          config: .markdownlint.json
          globs: |
            **/*.md
            !venv

      # Folded in from the deleted update-skills.yaml, which ran this same
      # validator on a daily 03:00 cron. It writes nothing, so its "open a PR if
      # anything changed" step could never fire — the check only ever has
      # something to catch on the PR that edits a skill.
      - name: Validate SKILL.md frontmatter
        if: steps.changes.outputs.skills == 'true'
        run: ./.github/scripts/update-skills.sh

      # Deliberately UNCONDITIONAL and deliberately in THIS job. The natural
      # home looks like lint-typecheck-test, but that job sits behind a
      # `**/*.py` paths filter — so on a docs-only PR, which is exactly the
      # change this check guards against, it would never run at all. A guard
      # placed behind a filter is absent precisely on the diffs it exists to
      # catch. This job installs no dependencies, so the legs needing project
      # imports report SKIPPED here and the pure-text ones still gate.
      - name: Doc-drift sanity checks
        run: python3 tools/sanity_checks.py

      # Stdlib-only, so it rides this dependency-free job. Unconditional for the
      # same reason as the step above: a guard behind a paths filter is absent on
      # some diff that reaches it. This step is only REACHABLE because
      # .claude/hooks/ is now committed -- while it was gitignored the suite could
      # run by hand and report failure to nobody, for days.
      - name: Context-guard hook suite
        run: python3 .claude/hooks/test_context_guard.py

      # Unconditional for the same reason as the suite above: this job is the only
      # dependency-free one, and a hook suite that runs only by hand reports failure
      # to nobody. Bare `python3`, no PYTHONPATH -- the hook imports stdlib only, so
      # this invocation is also the guarantee that it stays that way.
      - name: Shell-hygiene hook suite
        run: python3 .claude/hooks/test_guard_shell_hygiene.py

      # The BLOCKING guard, and the last of the three to get a suite -- until now
      # nothing had ever checked that it still blocks, which is the one hook where
      # a silent regression costs more than a missed note.
      - name: Destructive-guard hook suite
        run: python3 .claude/hooks/test_guard_destructive.py

      # The three suites above test hook MODULES. None of them could see the
      # 2026-09-23 defect, where every module was fine and every WRAPPER in
      # .claude/settings.json launched an interpreter that exits 126 on the
      # Windows host -- so the BLOCKING guard failed OPEN for five days.
      # This one reads the wrapper strings out of settings.json instead.
      #
      # It belongs in THIS job rather than the heavy leg: that leg is
      # paths-filtered to `**/*.py`, pyproject, poetry.lock and lint.yaml, and
      # settings.json is in none of them, so a settings-only diff would skip the
      # one gate written to protect it.
      - name: Hook wiring suite
        run: python3 .claude/hooks/test_hook_wiring.py

      # The SessionStart planning digest. Its contract -- always exit 0, never
      # silent, a failed fetch never rendered as an empty queue -- is what makes
      # the move of planning into GitHub Issues visible at all, so it rides the
      # same unconditional job as the guards. No network: gh/git are faked.
      - name: Open-issues digest suite
        run: python3 .claude/hooks/test_open_issues.py

  lint-typecheck-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Check for Python changes
        id: changes
        uses: dorny/paths-filter@v4
        with:
          filters: |
            python:
              - '**/*.py'
              - 'pyproject.toml'
              - 'poetry.lock'
              - '.github/workflows/lint.yaml'

      - name: Set up Python
        if: steps.changes.outputs.python == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install Poetry
        if: steps.changes.outputs.python == 'true'
        run: curl -sSL https://install.python-poetry.org | python3 -

      # Poetry's cache dir holds both the wheel artifacts and the virtualenv, so
      # a hit skips the whole resolve+download+build. Same key as
      # signal-watch.yaml, deliberately — the three jobs share one cache.
      - name: Cache Poetry download cache
        if: steps.changes.outputs.python == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        if: steps.changes.outputs.python == 'true'
        run: make poetry-install

      - name: Lint Python
        if: steps.changes.outputs.python == 'true'
        run: poetry run ruff check .

      - name: Check Python formatting
        if: steps.changes.outputs.python == 'true'
        run: poetry run ruff format --check .

      # `.claude/hooks` is named explicitly: mypy skips dot-directories, so the
      # hooks would be linted by ruff and never typechecked. Mirrors the
      # `typecheck` Make target — keep the two in step.
      - name: Type check
        if: steps.changes.outputs.python == 'true'
        run: poetry run mypy . .claude/hooks

      # Deliberately no --cov. Nothing in this repo consumes coverage: there is
      # no codecov/coveralls step, no fail_under gate, and coverage.xml was only
      # ever uploaded as an artifact nobody downloads. pytest-cov's tracer runs
      # on every line of every test, and this step is ~85% of the job, so that
      # was the most expensive unread file in CI. `make test-cov` still produces
      # it locally for anyone who actually wants to read it.
      # -q not -v: 2900 verbose lines make a failure harder to find, not easier.
      # --durations keeps the slowest tests visible so the next tuning round
      # starts from data rather than a guess.
      - name: Run tests
        if: steps.changes.outputs.python == 'true'
        run: poetry run pytest tests/ -q --durations=25 --junitxml=test-results.xml --ignore=tests/test_regression.py

      - name: Upload test results
        if: steps.changes.outputs.python == 'true' && !cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results.xml

  regression:
    name: Regression tests
    runs-on: ubuntu-latest
    needs: lint-typecheck-test
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Check for Python changes
        id: changes
        uses: dorny/paths-filter@v4
        with:
          # The backtest surface only — NOT '**/*.py', which fired the 7-minute
          # golden run on every tools/ or web/ change. tests/test_regression.py
          # imports from analytics.* alone. pyproject/poetry.lock stay in on
          # purpose: a pandas or numpy bump moves the goldens, and finding that
          # out silently is exactly what the suite exists to prevent.
          filters: |
            python:
              - 'analytics/**/*.py'
              - 'pyproject.toml'
              - 'poetry.lock'
              - 'config/*.toml'
              - 'tests/test_regression.py'
              - 'tests/fixtures/**.parquet'
              - 'tests/fixtures/golden_*.json'
              - 'scripts/extract_regression_fixture.py'
              - '.github/workflows/lint.yaml'

      - name: Set up Python
        if: steps.changes.outputs.python == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install Poetry
        if: steps.changes.outputs.python == 'true'
        run: curl -sSL https://install.python-poetry.org | python3 -

      - name: Cache Poetry download cache
        if: steps.changes.outputs.python == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        if: steps.changes.outputs.python == 'true'
        run: make poetry-install

      - name: Run regression tests
        if: steps.changes.outputs.python == 'true'
        run: make test-regression

  frontend-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Check for frontend changes
        id: changes
        uses: dorny/paths-filter@v4
        with:
          filters: |
            frontend:
              - 'web/ui/**'
              - '.github/workflows/lint.yaml'

      - name: Set up Node
        if: steps.changes.outputs.frontend == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/ui/package-lock.json

      - name: Install frontend dependencies
        if: steps.changes.outputs.frontend == 'true'
        run: cd web/ui && npm ci

      - name: Build frontend
        if: steps.changes.outputs.frontend == 'true'
        run: cd web/ui && npm run build

      - name: Svelte type check
        if: steps.changes.outputs.frontend == 'true'
        run: cd web/ui && npx svelte-check
